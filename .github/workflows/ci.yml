name: Partio CI/CD & Deployment Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 1: Smart Contract, ZK Circuits & Cohort Verification
  # ─────────────────────────────────────────────────────────────────────────────
  contract-ci:
    name: 1. Smart Contract & ZK Circuit Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            contract/package-lock.json
            frontend/package-lock.json

      - name: Circuit Budget Gate (Exported Circuits <= 10)
        run: |
          CIRCUIT_COUNT=$(grep -c 'export circuit' contract/src/splitshield.compact || echo 0)
          echo "Detected Exported Circuits: $CIRCUIT_COUNT"
          if [ "$CIRCUIT_COUNT" -gt 10 ]; then
            echo "❌ ERROR: Too many exported circuits ($CIRCUIT_COUNT). Maximum allowable is 10 to avoid block size rejection."
            exit 1
          fi
          echo "✅ Circuit budget check passed: $CIRCUIT_COUNT / 10 circuits."

      - name: Verify Multi-Network Cohorts (130 Unique Users, 0 Overlap)
        run: node scripts/onboard-users.mjs

      - name: Install Contract Dependencies
        run: npm install --prefix contract

      - name: Run Vitest Circuit Simulation Tests (All 18 Circuits)
        run: npm test --prefix contract

      - name: Verify Generated Compact ZKIR & Prover Artifacts
        run: node scripts/verify-deployment.mjs

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 2: Frontend Production Build & TypeScript Verification
  # ─────────────────────────────────────────────────────────────────────────────
  frontend-ci:
    name: 2. Frontend Build & Production Packaging
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            contract/package-lock.json
            frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm install --prefix frontend

      - name: Build Frontend Application (TypeScript + Vite)
        run: npm run build --prefix frontend

      - name: Verify Production Dist Output
        run: |
          test -f frontend/dist/index.html || { echo "❌ Missing index.html in frontend/dist"; exit 1; }
          test -f frontend/dist/favicon.svg || { echo "❌ Missing favicon.svg in frontend/dist"; exit 1; }
          echo "✅ Frontend production build artifact verified."

      - name: Upload Frontend Production Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 3: Multi-Network Preprod & Netlify Readiness
  # ─────────────────────────────────────────────────────────────────────────────
  deployment-readiness:
    name: 3. Multi-Network Preprod & Netlify Readiness
    needs: [contract-ci, frontend-ci]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            contract/package-lock.json
            frontend/package-lock.json

      - name: Verify Network Configuration
        run: |
          node -e "
            console.log('✅ Target Networks: Midnight Preprod & Preview');
            console.log('✅ Midnight Preprod RPC: https://rpc.preprod.midnight.network');
            console.log('✅ Midnight Preview RPC: https://rpc.preview.midnight.network');
            console.log('✅ Preprod GraphQL Indexer: https://indexer.preprod.midnight.network/api/v4/graphql');
            console.log('✅ Preview GraphQL Indexer: https://indexer.preview.midnight.network/api/v4/graphql');
          "

      - name: Verify Netlify Deployment Configuration
        run: |
          node -e "
            const fs = require('fs');
            if (!fs.existsSync('netlify.toml')) throw new Error('Missing netlify.toml');
            if (!fs.existsSync('frontend/public/_redirects')) throw new Error('Missing _redirects file');
            console.log('✅ Root netlify.toml and SPA _redirects verified.');
          "

      - name: Verify SplitShield Compiled Bytecode & Key Assets
        run: node scripts/verify-deployment.mjs

      - name: Download Frontend Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: ./dist

      - name: Setup GitHub Pages (Optional Live Staging)
        continue-on-error: true
        uses: actions/configure-pages@v4

      - name: Upload Pages Artifact (Optional)
        continue-on-error: true
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages (Optional Live Staging)
        continue-on-error: true
        id: deployment
        uses: actions/deploy-pages@v4
