name: SplitShield CI/CD & Deployment Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 1: Circuit Budget Gate, Test Circuits & Frontend Packaging
  # ─────────────────────────────────────────────────────────────────────────────
  build-and-test:
    name: 1. Build, Verify Circuits & Run Test Suites
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Circuit Budget Gate (Exported Circuits <= 10)
        run: |
          CIRCUIT_COUNT=$(grep -c 'export circuit' contract/src/splitshield.compact || echo 0)
          echo "Detected Exported Circuits: $CIRCUIT_COUNT"
          if [ "$CIRCUIT_COUNT" -gt 10 ]; then
            echo "❌ ERROR: Too many exported circuits ($CIRCUIT_COUNT). Maximum allowable is 10 to avoid block size rejection."
            exit 1
          fi
          echo "✅ Circuit budget check passed: $CIRCUIT_COUNT / 10 circuits."

      - name: Verify User Cohorts (USERS.md & LAUNCH_USERS.md)
        run: node scripts/onboard-users.mjs

      - name: Install Contract Dependencies
        run: npm install --prefix contract

      - name: Run Vitest Circuit Simulation Tests (All 8 Circuits)
        run: npm test --prefix contract

      - name: Verify Generated Compact ZKIR & Prover Artifacts
        run: node scripts/verify-deployment.mjs

      - name: Install Frontend Dependencies
        run: npm install --prefix frontend

      - name: Build Frontend Application (TypeScript + Vite)
        run: npm run build --prefix frontend

      - name: Upload Frontend Production Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 2: Smart Contract Deployment Verification & Simulation Pipeline
  # ─────────────────────────────────────────────────────────────────────────────
  contract-deployment:
    name: 2. Smart Contract Preprod Deployment Pipeline
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install Contract Dependencies
        run: npm install --prefix contract

      - name: Verify Preprod Network Endpoints & RPC Configuration
        run: |
          echo "Verifying Midnight Preprod Network Configuration..."
          npx tsx -e "
            import { NETWORK_CONFIGS } from './contract/scripts/network.js';
            const preprod = NETWORK_CONFIGS.preprod;
            console.log('Target Network:', preprod.networkId);
            console.log('Substrate RPC:', preprod.node);
            console.log('GraphQL Indexer:', preprod.indexer);
            console.log('Proof Server:', preprod.proofServer);
          "

      - name: Verify SplitShield Compiled Bytecode & Key Assets
        run: node scripts/verify-deployment.mjs

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 3: Frontend Web Deployment (Live Staging / Pages)
  # ─────────────────────────────────────────────────────────────────────────────
  frontend-deployment:
    name: 3. Frontend Web Hosting Deployment Pipeline
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download Frontend Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: ./dist

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages (Live Staging)
        id: deployment
        uses: actions/deploy-pages@v4
