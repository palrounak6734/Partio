# Netlify Build Configuration for Partio DApp

[build]
  base = "frontend"
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--include=optional"

# SPA Routing: Redirect all routes to index.html for client-side navigation
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# HTTP Headers for Web3 & WASM security
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
