<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f18"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d15"/>
    </linearGradient>

    <!-- Emerald-to-Cyan Primary Gradient -->
    <linearGradient id="pGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Accent Cyan Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Subtle Inner Border Highlight -->
  <rect x="6" y="6" width="116" height="116" rx="26" fill="none" stroke="rgba(52, 211, 153, 0.15)" stroke-width="1.5"/>

  <!-- Geometric Minimalist "P" Partition Icon -->
  <g transform="translate(4, 0)">
    <!-- Vertical Pillar (Confidential Foundation) -->
    <rect x="32" y="28" width="15" height="72" rx="7.5" fill="url(#pGrad)"/>

    <!-- Upper Partition Ray 1 (Top Loop Arc) -->
    <path d="M 47 28 L 72 28 C 88 28 98 38 98 52 C 98 66 88 76 72 76 L 47 76" 
          fill="none" 
          stroke="url(#pGrad)" 
          stroke-width="14" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Inner Shield Partition / ZK Slices -->
    <path d="M 47 44 L 68 44 C 74 44 80 48 80 52 C 80 56 74 60 68 60 L 47 60" 
          fill="none" 
          stroke="url(#accentGrad)" 
          stroke-width="4" 
          stroke-linecap="round" 
          opacity="0.9"/>

    <!-- Zero-Knowledge Node (Privacy Core) -->
    <circle cx="68" cy="52" r="5" fill="#38bdf8" filter="url(#glow)"/>
    <circle cx="68" cy="52" r="2.5" fill="#ffffff"/>
  </g>
</svg>
